project:
  name: DRC Flood Extent Mapping
  version: "1.0"

aoi:
  name: Eastern DRC
  provinces:
    - North Kivu
    - South Kivu
    - Ituri
  bbox:
    # [west, south, east, north] in WGS84
    west: 26.8
    south: -5.9
    east: 30.8
    north: 3.0
  crs: EPSG:4326
  output_crs: EPSG:32735  # UTM Zone 35S — appropriate for eastern DRC

temporal:
  start: "2025-01-01"
  end: "2026-07-31"
  frequency: monthly

data_sources:
  sar:
    platform: Sentinel-1
    product: GRD
    mode: IW
    polarizations: [VV, VH]
    catalog: https://earth-search.aws.element84.com/v1
    collection: sentinel-1-grd
  optical:
    platform: Sentinel-2
    product: L2A
    catalog: https://earth-search.aws.element84.com/v1
    collection: sentinel-2-l2a
    max_cloud_cover: 20  # % — will be sparse given DRC cloud cover

processing:
  tile_size: 512
  speckle_filter: lee  # options: lee, refined_lee, gamma_map
  flood_threshold_method: otsu
  baseline_months: 3   # months of pre-event imagery to build dry baseline
  # Change-detection threshold: -5 dB (raised from -3 dB 2026-07-08).
  # Sep 2025 spike (3,427 km²) was a wet-soil/forest artifact; -3 dB is too
  # permissive in tropical equatorial environments during rainy-season onset.
  # -5 dB requires a halving of power beyond the wet-soil noise floor (~-3 dB).
  change_threshold_db: -5.0
  # VH/VV ratio filter (None = disabled; -10.0 recommended once VH files verified)
  vh_ratio_threshold_db: null
  # Absolute backscatter gate (added 2026-09-20). Relative change alone flags
  # pixels far too bright to be standing water: in 2026-07 the flagged pixels
  # reached -7.3 dB at p90, while open water in this AOI sits near -23 dB and dry
  # land near -10.5 dB. A flood pixel must now also be dark in absolute terms.
  absolute_db_max: -12.0
  # fixed = use absolute_db_max as a ceiling (default, and what you want for
  # shallow/vegetated flooding). otsu = per-scene open-water/land split of the
  # month's dB histogram: much stricter (-12 to -16.8 dB here) and it removes
  # vegetated flooding, so use it only for open-water-only mapping.
  absolute_threshold_method: fixed
  # Dilate the permanent-water mask by this many 100 m pixels before applying it.
  # Absorbs shoreline and geolocation error that otherwise leaves a ring of false
  # positives around lakes and rivers (37% of 2026-07's extent sat within 500 m
  # of permanent water, against 0.3% for 2025-09).
  water_buffer_px: 3

output:
  format: GeoTIFF  # Cloud-Optimized GeoTIFF (COG)
  nodata: -9999
  dtype: float32
